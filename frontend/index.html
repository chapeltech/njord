<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plutus</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main id="app"></main>
    <script src="/app.js"></script>
    <script>
      const app = Elm.Main.init({ node: document.getElementById("app") });
      if (app.ports && app.ports.alertUser) {
        app.ports.alertUser.subscribe((message) => window.alert(message));
      }
    </script>
  </body>
</html>
