log_format njord_no_args '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name accounts.test;

    client_max_body_size 2m;
    access_log /var/log/nginx/access.log njord_no_args;

    location /__github/ {
        proxy_pass http://github:18084/;
        proxy_set_header Host github;
    }

    location / {
        proxy_pass http://njord:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
