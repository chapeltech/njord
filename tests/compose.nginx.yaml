name: ${NJORD_NGINX_TEST_PROJECT:-njord-nginx-test}

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    networks:
      - edge

networks:
  edge:
    external: true
    name: ${NJORD_DOCKER_NETWORK:-njord-edge}
